name: Publish to PlatformIO Registry

on:
  push:
    branches: [main]

permissions:
  contents: write # push the version-bump commit and release tag

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  verify:
    # Same gate as scripts/verify.py, run independently of the scripts the
    # pushed commits carry: commit lint, script tests, native tests, example build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the commit range

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Lint commits since the last release
        run: |
          # The last release is the bot's newest chore(release) commit on
          # main's first-parent line (earlier releases pushed no tags).
          LAST=$(git log --first-parent -n 1 --format=%H --grep='^chore(release): v' HEAD)
          python3 scripts/check_commits.py range "${LAST:?no previous release commit}..HEAD"

      - name: Script unit tests
        run: python3 -m unittest discover -s scripts/tests -t scripts

      - name: Native unit tests
        run: pio test -e native

      - name: Example build
        run: pio run -e example-read-registers

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Bump version
        id: bump
        run: |
          # The level is derived from the Conventional Commits since the last
          # release (feat -> minor, "!" or BREAKING CHANGE -> major, else
          # patch). Subject-line tokens such as #minor have no effect.
          LAST=$(git log --first-parent -n 1 --format=%H --grep='^chore(release): v' HEAD)
          LEVEL=$(python3 scripts/release_level.py "${LAST:?no previous release commit}..HEAD")
          echo "Release level since $LAST: $LEVEL"
          echo "version=$(python3 scripts/bump_version.py "$LEVEL")" >> "$GITHUB_OUTPUT"

      - name: Commit bump and tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v${{ steps.bump.outputs.version }} [skip ci]"
          # Annotated, so --follow-tags pushes it (lightweight tags are skipped).
          git tag -a "v${{ steps.bump.outputs.version }}" -m "v${{ steps.bump.outputs.version }}"
          git push origin main --follow-tags

      - name: Publish
        env:
          PLATFORMIO_AUTH_TOKEN: ${{ secrets.PLATFORMIO_AUTH_TOKEN }}
        run: pio pkg publish --no-interactive
