[platformio]
build_cache_dir = .pio/buildcache
; Bare `pio run` builds the hardware examples only; the native env is for
; `pio test -e native` and has no main() to link as a program.
default_envs = example-read-registers, example-load-patch-bundle, example-eeprom-update

[teensy_base]
platform = teensy
framework = arduino
monitor_speed = 115200
;monitor_filters = time
;build_flags = -DDEBUG_LEVEL_MAX=1
board = teensy40

[env:example-read-registers]
extends = teensy_base
build_src_filter = +<*> +<../examples/read-registers/src>

[env:example-load-patch-bundle]
extends = teensy_base
build_src_filter = +<*> +<../examples/load-patch-bundle/src>

[env:example-eeprom-update]
extends = teensy_base
build_src_filter = +<*> +<../examples/eeprom-update/src>

; Unattended version of eeprom-update: writes the embedded bundle at power-up
; when the booted region differs, with no serial input. It shares the bundle
; header of eeprom-update through the include path.
[env:example-eeprom-auto-update]
extends = teensy_base
build_src_filter = +<*> +<../examples/eeprom-auto-update/src>
build_flags = -I examples/eeprom-update/src

; Bench console for the tps25751-pd-bench MCP server in tools/pd-bench. The
; Teensy enumerates as Dual Serial (VID 0x16C0, PID 0x048B): logs on Serial, the
; console protocol on SerialUSB1. The pre-script passes the version in
; library.json to the console's HELLO reply.
[env:example-pd-bench]
extends = teensy_base
build_src_filter = +<*> +<../examples/pd-bench/src>
build_flags = -D USB_DUAL_SERIAL
extra_scripts = pre:examples/pd-bench/library_version.py

; The same console with the patch bundle of examples/load-patch-bundle compiled
; in, for a board without a configuration EEPROM: the console reloads the bundle
; when the controller stays in PTCH, which a cold restart ('GAID') causes.
[env:example-pd-bench-patch]
extends = env:example-pd-bench
build_flags =
    ${env:example-pd-bench.build_flags}
    -D PD_BENCH_PATCH_BUNDLE

; Host-run unit tests (no hardware, no Arduino framework): `pio test -e native`.
; Compiled: the register base class, the debug helpers, the PDO and RDO value
; types, the factory, and every register class in address order; the EEPROM
; updater (TPS25751EepromUpdater.cpp), which reaches the controller only through
; the TPS25751CommandExecutor interface and is driven by
; test/support/native/FakeCommandExecutor.h; the app config image editor
; (TPS25751AppConfigImage.cpp), which works on a buffer only; and TPS25751.cpp and
; TPS25751PatchLoader.cpp, which reach the bus through the TwoWire fake in
; test/support/native/Wire.h, driven by FakeTps25751Target.h; and the bench
; console (TPS25751BenchProtocol.cpp and TPS25751BenchConsole.cpp), driven on
; the same TwoWire fake by FakeBenchTarget.h and FakeStream.h. Not compiled:
; TPS25751HostExecutor.cpp and TPS25751DownstreamDevice.cpp, which no suite
; tests. Arduino API symbols (Stream, Serial, F(), millis(), delay(),
; digitalRead()) come from the stubs in test/support/native, with a clock the
; tests control.
[env:native]
platform = native
test_framework = unity
test_filter = test_native/*
test_build_src = yes
build_src_filter =
    +<TPS25751Register.cpp>
    +<TPS25751Debug.cpp>
    +<TPS25751RegisterFactory.cpp>
    +<TPS25751Pdo.cpp>
    +<TPS25751Rdo.cpp>
    +<TPS25751Mode.cpp>
    +<TPS25751CustomerUse.cpp>
    +<TPS25751Command.cpp>
    +<TPS25751Data.cpp>
    +<TPS25751Version.cpp>
    +<TPS25751InterruptEvent.cpp>
    +<TPS25751InterruptMask.cpp>
    +<TPS25751InterruptClear.cpp>
    +<TPS25751Status.cpp>
    +<TPS25751PowerPathStatus.cpp>
    +<TPS25751GlobalSystemConfig.cpp>
    +<TPS25751PortConfig.cpp>
    +<TPS25751PortControl.cpp>
    +<TPS25751BootFlags.cpp>
    +<TPS25751ReceivedSourceCaps.cpp>
    +<TPS25751ReceivedSinkCaps.cpp>
    +<TPS25751TransmitSourceCaps.cpp>
    +<TPS25751TransmitSinkCaps.cpp>
    +<TPS25751ActivePDOContract.cpp>
    +<TPS25751ActiveRDOContract.cpp>
    +<TPS25751AutoNegotiateSink.cpp>
    +<TPS25751PowerStatus.cpp>
    +<TPS25751PDStatus.cpp>
    +<TPS25751PD3Config.cpp>
    +<TPS25751ReceivedSOPIdentity.cpp>
    +<TPS25751IOConfig.cpp>
    +<TPS25751TypeCState.cpp>
    +<TPS25751ADCResults.cpp>
    +<TPS25751SleepControl.cpp>
    +<TPS25751GPIOStatus.cpp>
    +<TPS25751TransmitSourceCapsExtended.cpp>
    +<TPS25751TransmitSourceInfo.cpp>
    +<TPS25751TransmitPPSStatus.cpp>
    +<TPS25751TransmitBatteryStatus.cpp>
    +<TPS25751TransmitBatteryCapabilities.cpp>
    +<TPS25751TransmitSinkCapsExtended.cpp>
    +<TPS25751LiquidDetectionConfig.cpp>
    +<TPS25751EepromUpdater.cpp>
    +<TPS25751AppConfigImage.cpp>
    +<TPS25751.cpp>
    +<TPS25751PatchLoader.cpp>
    +<TPS25751BenchProtocol.cpp>
    +<TPS25751BenchConsole.cpp>
build_flags =
    -std=gnu++17
    -I test/support/native

; Line coverage of the native tests: `test/coverage.sh` (see TESTING.md).
; Same sources and tests as [env:native], built with --coverage and without
; optimization so each source line maps to code. The script deletes stale
; .gcda counters, runs every suite, and prints per-file line coverage for src/
; with gcovr.
[env:native-coverage]
extends = env:native
build_flags =
    ${env:native.build_flags}
    --coverage
    -O0
extra_scripts = post:test/support/coverage_link.py
