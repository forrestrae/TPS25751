[platformio]
build_cache_dir = .pio/buildcache
; Bare `pio run` builds the hardware examples only; the native env is for
; `pio test -e native` and has no main() to link as a program.
default_envs = example-read-registers, example-load-patch-bundle

[teensy_base]
platform = teensy
framework = arduino
monitor_speed = 115200
;monitor_filters = time
;build_flags = -DDEBUG_LEVEL_MAX=1
board = teensy40

[env:example-read-registers]
extends = teensy_base
build_src_filter = +<*> +<../examples/read-registers/src>

[env:example-load-patch-bundle]
extends = teensy_base
build_src_filter = +<*> +<../examples/load-patch-bundle/src>

; Host-run unit tests (no hardware, no Arduino framework): `pio test -e native`.
; Every register class and the factory are compiled, in address order; the
; I2C-facing sources (TPS25751.cpp, the downstream-device proxy, the patch
; loader) are not. Arduino API symbols the sources reference (Stream, Serial,
; F(), millis()) come from test/support/native stubs.
[env:native]
platform = native
test_framework = unity
test_filter = test_native/*
test_build_src = yes
build_src_filter =
    +<TPS25751Register.cpp>
    +<TPS25751Debug.cpp>
    +<TPS25751RegisterFactory.cpp>
    +<TPS25751Mode.cpp>
    +<TPS25751CustomerUse.cpp>
    +<TPS25751Command.cpp>
    +<TPS25751Data.cpp>
    +<TPS25751Version.cpp>
    +<TPS25751InterruptEvent.cpp>
    +<TPS25751InterruptMask.cpp>
    +<TPS25751InterruptClear.cpp>
    +<TPS25751Status.cpp>
    +<TPS25751PowerPathStatus.cpp>
    +<TPS25751GlobalSystemConfig.cpp>
    +<TPS25751PortConfig.cpp>
    +<TPS25751PortControl.cpp>
    +<TPS25751BootFlags.cpp>
    +<TPS25751ReceivedSourceCaps.cpp>
    +<TPS25751ReceivedSinkCaps.cpp>
    +<TPS25751TransmitSourceCaps.cpp>
    +<TPS25751TransmitSinkCaps.cpp>
    +<TPS25751ActivePDOContract.cpp>
    +<TPS25751ActiveRDOContract.cpp>
    +<TPS25751AutoNegotiateSink.cpp>
    +<TPS25751PowerStatus.cpp>
    +<TPS25751PDStatus.cpp>
    +<TPS25751PD3Config.cpp>
    +<TPS25751ReceivedSOPIdentity.cpp>
    +<TPS25751IOConfig.cpp>
    +<TPS25751TypeCState.cpp>
    +<TPS25751ADCResults.cpp>
    +<TPS25751SleepControl.cpp>
    +<TPS25751GPIOStatus.cpp>
    +<TPS25751TransmitSourceCapsExtended.cpp>
    +<TPS25751TransmitSourceInfo.cpp>
    +<TPS25751TransmitPPSStatus.cpp>
    +<TPS25751TransmitBatteryStatus.cpp>
    +<TPS25751TransmitBatteryCapabilities.cpp>
    +<TPS25751TransmitSinkCapsExtended.cpp>
    +<TPS25751LiquidDetectionConfig.cpp>
build_flags =
    -std=gnu++17
    -I test/support/native

; Line coverage of the native tests: `test/coverage.sh` (see TESTING.md).
; Same sources and tests as [env:native], built with --coverage and without
; optimization so each source line maps to code. The script deletes stale
; .gcda counters, runs every suite, and prints per-file line coverage for src/
; with gcovr.
[env:native-coverage]
extends = env:native
build_flags =
    ${env:native.build_flags}
    --coverage
    -O0
extra_scripts = post:test/support/coverage_link.py
