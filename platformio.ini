[platformio]
build_cache_dir = .pio/buildcache
; Bare `pio run` builds the hardware examples only; the native env is for
; `pio test -e native` and has no main() to link as a program.
default_envs = example-read-registers, example-load-patch-bundle

[teensy_base]
platform = teensy
framework = arduino
monitor_speed = 115200
;monitor_filters = time
;build_flags = -DDEBUG_LEVEL_MAX=1
board = teensy40

[env:example-read-registers]
extends = teensy_base
build_src_filter = +<*> +<../examples/read-registers/src>

[env:example-load-patch-bundle]
extends = teensy_base
build_src_filter = +<*> +<../examples/load-patch-bundle/src>

; Host-run unit tests (no hardware, no Arduino framework): `pio test -e native`.
; Only platform-independent sources are compiled; Arduino API symbols they
; reference (Stream, Serial, F(), millis()) come from test/support/native stubs.
[env:native]
platform = native
test_framework = unity
test_filter = test_native/*
test_build_src = yes
build_src_filter =
    +<TPS25751Register.cpp>
    +<TPS25751Debug.cpp>
    +<TPS25751Status.cpp>
    +<TPS25751SleepControl.cpp>
    +<TPS25751CustomerUse.cpp>
    +<TPS25751InterruptMask.cpp>
    +<TPS25751InterruptClear.cpp>
    +<TPS25751ADCResults.cpp>
    +<TPS25751TransmitSourceCaps.cpp>
    +<TPS25751TransmitSinkCaps.cpp>
    +<TPS25751AutoNegotiateSink.cpp>
    +<TPS25751IOConfig.cpp>
    +<TPS25751LiquidDetectionConfig.cpp>
    +<TPS25751Version.cpp>
    +<TPS25751PD3Config.cpp>
    +<TPS25751GlobalSystemConfig.cpp>
    +<TPS25751ReceivedSOPIdentity.cpp>
    +<TPS25751PortControl.cpp>
    +<TPS25751GPIOStatus.cpp>
    +<TPS25751PortConfig.cpp>
    +<TPS25751InterruptEvent.cpp>
    +<TPS25751ActiveRDOContract.cpp>
    +<TPS25751ActivePDOContract.cpp>
build_flags =
    -std=gnu++17
    -I test/support/native
