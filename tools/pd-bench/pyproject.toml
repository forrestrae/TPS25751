[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tps25751-pd-bench"
version = "0.1.0"  # also reported as serverInfo.version in the MCP handshake
description = "MCP server for the TPS25751 bench console: register reads, 4CC tasks, and renegotiation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    # <3: the 1.x to 2.x major bump renamed FastMCP to MCPServer and broke imports.
    "mcp>=2.3.0,<3",
    "pyserial>=3.5",
]

[project.scripts]
tps25751-pd-bench = "tps25751_pd_bench.server:main"
tps25751-pd-crosscheck = "tps25751_pd_bench.crosscheck:main"

[dependency-groups]
# `uv run` installs this group by default; the verify gate runs `uv run --locked pytest` here.
dev = [
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tps25751_pd_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
# Keep the tests from leaving files the verify gate would report as untracked.
addopts = "-p no:cacheprovider"
